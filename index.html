<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Gracefully handle Vite HMR WebSocket events in preview/iFrame environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) || '';
        var stack = (reason && reason.stack) || '';
        if (msg.includes('WebSocket') || stack.includes('@vite/client')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        if (msg.includes('WebSocket')) {
          event.preventDefault();
        }
      });
      // Theme & Motion Bootstrap
      (function() {
        try {
          var savedTheme = localStorage.getItem('mudaqqeq_theme');
          var validThemes = ['light-sky', 'dark', 'current', 'aurora', 'aurora-sky'];
          var theme = validThemes.indexOf(savedTheme) !== -1 ? savedTheme : 'light-sky';
          document.documentElement.setAttribute('data-theme', theme);

          var savedMotion = localStorage.getItem('mudaqqeq_motion');
          var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var motion = savedMotion ? savedMotion : (prefersReduced ? 'off' : 'on');
          document.documentElement.setAttribute('data-motion', motion);
        } catch (_) {}
      })();
    </script>
